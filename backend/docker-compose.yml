# Barry backend + Cloudflare Tunnel — self-host stack (Unraid, etc.).
#
# Publishes the backend at https://barry.wide-stack.com via a Cloudflare Tunnel:
# no port-forwarding, no exposed home IP, TLS terminated at Cloudflare's edge.
# See UNRAID.md for the full walkthrough.
#
#   CLOUDFLARE_TUNNEL_TOKEN=<token from the Cloudflare dashboard> \
#   docker compose up -d --build
#
# IMPORTANT: run exactly ONE backend instance — the TTL cache, active-station
# registry, and METAR scheduler are all in-process (see app/cache.py). Do not
# scale this service without moving that state to Redis first.

services:
  barry-backend:
    build: .
    image: barry-backend:latest
    container_name: barry-backend
    restart: unless-stopped
    mem_limit: 768m
    labels:
      - "autoheal=true"       # restarted by the autoheal service when unhealthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PORT=8080
      # Small persisted state (bulk-snapshot history for the front watch), so
      # a redeploy doesn't cost a 7.5 h warm-up. Lives next to the compose file.
      - BARRY_DATA_DIR=/var/lib/barry
    volumes:
      - ./state:/var/lib/barry
    # Optional: also expose on the LAN (e.g. for testing from the server itself).
    # The tunnel does NOT need this — it reaches the container over the compose
    # network as http://barry-backend:8080.
    ports:
      - "127.0.0.1:8077:8080"   # Tower-local only; the LAN went round Cloudflare
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  autoheal:
    # Compose restarts a container that exits, not one whose health check
    # fails. This one watches for "unhealthy" on labelled containers and
    # restarts them. It needs the Docker socket, which is root on the host,
    # so the image is pinned, has no network, and does nothing else.
    image: willfarrell/autoheal:1.2.0
    container_name: barry-autoheal
    restart: always
    mem_limit: 64m
    network_mode: none
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  cloudflared:
    image: cloudflare/cloudflared:2026.6.1   # pinned; bump on purpose
    container_name: barry-cloudflared
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: tunnel --no-autoupdate run
    environment:
      # Token from Cloudflare Zero Trust → Networks → Tunnels (dashboard-managed).
      # The public hostname (barry.wide-stack.com → http://barry-backend:8080) is
      # configured in that dashboard, not here.
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - barry-backend
